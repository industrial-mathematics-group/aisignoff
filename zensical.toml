# Documentation site, built with Zensical (https://zensical.org) from the Markdown files in docs/.
#   pip install -r docs/requirements.txt
#   zensical serve            # preview at http://localhost:8000
#   zensical build --strict   # what CI runs: fails on broken links

[project]
site_name = "aisignoff"
site_description = "Sign off on AI use per file: declare and check AI generation, human review and AI review."
site_url = "https://industrial-mathematics-group.github.io/aisignoff/"
repo_url = "https://github.com/industrial-mathematics-group/aisignoff"
repo_name = "industrial-mathematics-group/aisignoff"
edit_uri = "edit/main/docs/"
copyright = "MIT License · Industrial Mathematics Group"
exclude_docs = """
requirements.txt
"""

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "SIGNOFF.toml" = "signoff-toml.md" },
  { "Inline tags" = "inline-tags.md" },
  { "Line by line" = "history.md" },
  { "Commands" = "commands.md" },
  { "CI and badges" = "ci.md" },
  { "Folder report" = "report.md" },
  { "Example workflows" = "integration.md" },
  { "Migrating" = "migrating.md" },
  { "Compatibility" = "compatibility.md" },
  { "Changelog" = "changelog.md" },
  { "Development" = "development.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true

[project.theme]
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

# Follow the operating system, with a toggle in the header
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Markdown extensions used by the docs. Listing any turns off Zensical's defaults,
# so "tables" is listed explicitly.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

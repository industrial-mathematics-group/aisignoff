name: File-signoff

# Checks with aisignoff that every file is declared in SIGNOFF.toml or inline tags,
# and publishes the file badges on pushes to the default branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  file-signoff:
    uses: industrial-mathematics-group/.github/.github/workflows/file-signoff.yml@main
    with:
      # aisignoff checks itself with its own code at this commit, so a pull request can use
      # SIGNOFF.toml features that main doesn't know yet
      aisignoff-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    #   weight: lines            # weight the badges by lines instead of files

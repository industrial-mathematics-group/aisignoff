name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, for line-by-line declarations ([history])
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: The tool declares its own files
        run: aisignoff lint
  lowest-git:
    # the oldest git that aisignoff supports (MIN_GIT in src/aisignoff/history.py): Ubuntu 22.04's 2.34
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl && git --version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: |
          uv venv --python 3.11 /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install --python /opt/venv/bin/python -e . pytest
      - run: pytest -q
      - run: aisignoff lint

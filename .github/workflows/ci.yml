name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, for line-by-line declarations ([history])
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: The tool declares its own files
        run: aisignoff lint
  lowest-git:
   # the oldest git that aisignoff supports (MIN_GIT in src/aisignoff/history.py): Ubuntu 22.04's 2.34
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && git --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest -q
      - name: The tool declares its own files
        run: aisignoff lint

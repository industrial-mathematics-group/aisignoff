version = 3
exclude = ["reviews/**"]   # committed AI reviews (CONTRIBUTING.md) need no declaration

# Line-level declarations from git history (aisignoff >= 0.12): each line takes the declaration of the
# commit that landed it on main (Key: value lines, or the ticked boxes of the PR template in its
# merge or squash commit); the annotations below are the fallback for lines without one.
# SIGNOFF.snapshot.json holds the levels of every line as of main at 50adb1f, as aisignoff 0.11
# reported them: lines unchanged since keep them, and the [[commits]] entries below only matter
# for them through it.
[history]
enabled = true

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A2"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"]

[[annotations]]
path = "LICENSE"   # standard MIT text, added by Pascal
AI-Generation = "G0"
Human-Review = "H1"
AI-Review = "A2"
Reviewed-by = ["blhackslash <dev@blackslash.win>"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"]

# Changed after the A2 reviews in reviews/05ff570.md (fixes for their findings): self-checked only.
# Rename aidecl -> aisignoff, SIGNOFF.toml with fallback to AIDECL.toml, PyPI publishing (0.4.0).
# Written by Claude and only self-checked; the human review is still open.
# Documentation site (MkDocs on GitHub Pages), shorter README, callers of the renamed org workflows.
# Written by Claude and only self-checked; the human review is still open.
# Docs moved from MkDocs to Zensical; version read from the package metadata (only pyproject.toml has it).
# Written by Claude and only self-checked; the human review is still open.
# Example workflows and pre-commit hook for integrating aisignoff, with their documentation.
# Written by Claude and only self-checked; the human review is still open.
# Folder report: aisignoff report --tree / --html, its documentation, example workflows using it, version 0.5.0.
# Written by Claude and only self-checked; the human review is still open.
# PR #1 (fixes for the findings in reviews/815acaf.md): its commit 3832a1e left the human review TODO,
# which cf049e5 in the same PR filled in as H1 in AIDECL.toml.
[[commits]]
commit = "3832a1e"
Human-Review = "H1"
Reviewed-by = ["blhackslash <dev@blackslash.win>"]


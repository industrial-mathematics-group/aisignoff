version = 3
exclude = ["reviews/**"]   # committed AI reviews (CONTRIBUTING.md) need no declaration

# Line-level declarations from git history (aisignoff >= 0.12): each line takes the declaration of the
# commit that landed it on main (Key: value lines, or the ticked boxes of the PR template in its
# merge or squash commit); the annotations below are the fallback for lines without one.
# SIGNOFF.snapshot.json holds the levels of every line as of main at 50adb1f, as aisignoff 0.11
# reported them: lines unchanged since keep them, and the [[commits]] entries below only matter
# for them through it.
[history]
enabled = true

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A2"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"]

[[annotations]]
path = "LICENSE"   # standard MIT text, added by Pascal
AI-Generation = "G0"
Human-Review = "H1"
AI-Review = "A2"
Reviewed-by = ["blhackslash <dev@blackslash.win>"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation (reviews/)"]

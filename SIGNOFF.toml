version = 4
exclude = ["reviews/**"]   # committed AI reviews (CONTRIBUTING.md) need no declaration

# Line-level declarations from git history (aisignoff >= 0.12): each line takes the declaration of the
# commit that landed it on main (Key: value lines, or the ticked boxes of the PR template in its
# merge or squash commit); the annotations below are the fallback for lines without one.
# Up to aisignoff 0.16, SIGNOFF.snapshot.json kept the levels of older lines. Its archived entries
# and the [[commits]] entries that keep what it said (written by examples/unfreeze.py) are below.
[history]
enabled = true

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A0"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]

[[annotations]]
path = "LICENSE"   # standard MIT text, added by Pascal
AI-Generation = "G0"
Human-Review = "H1"
AI-Review = "A0"
Reviewed-by = ["blhackslash <dev@blackslash.win>"]

[[attestations]]
path = "src/aisignoff/model.py"
blob = "4648e82a6e86d3b5482ed9679b54a1f7e210ebd1"
AI-Review = "A2"
AI-Reviewed-by = ["GPT-6 (OpenAI), independent session without the generating conversation, reviews/2026-11-19-main.md"]


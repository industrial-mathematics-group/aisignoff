version = 3
exclude = ["reviews/**"]   # committed AI reviews (CONTRIBUTING.md) need no declaration

# Line-level declarations from git history (aisignoff >= 0.6): each line takes the declaration of the
# commit that landed it (trailers), the annotations below are the fallback for lines without one.
[history]
enabled = true

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A2"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]

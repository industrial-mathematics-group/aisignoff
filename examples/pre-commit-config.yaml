# Example for pre-commit (https://pre-commit.com): runs "aisignoff lint" before each commit.
# Copy it to .pre-commit-config.yaml in your repository (or add the entry to yours),
# then run "pre-commit install".
repos:
  - repo: https://github.com/industrial-mathematics-group/aisignoff
    rev: v0.12.0   # a release tag, the same version as in your workflows ([history] needs v0.6.0 or later)
    hooks:
      - id: aisignoff-lint

  # Or install aisignoff from PyPI (also works for v0.4.2 and earlier, which have no hook):
  # - repo: local

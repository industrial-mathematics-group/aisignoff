# Example workflow: show reviewers the declarations of just the lines a pull request changes.
# Copy it to .github/workflows/ in your repository. Most useful with [history] in SIGNOFF.toml
# (line-by-line declarations from git, aisignoff >= 0.6); without it, the changed lines take the
# file-level declarations.
#
#   - writes "aisignoff diff" to the job summary: the levels of the added and removed lines per
#     folder, attestations the pull request adds, and how the repository's shares move
#   - declares the pull request's lines from its description, read as aisignoff reads the merge
#     or squash commit when the repository's default commit message is "Pull request title and
#     description": "Key: value" lines (AI-Generation, Human-Review, AI-Review and the names), or
#     the ticked checkboxes of the pull request template (aisignoff >= 0.12: --declare-from).
#     A pull request into another branch than the default one declares nothing: its lines are
#     declared by the pull request that lands them on the default branch.
#
# It only reads the repository, so it also works for pull requests from forks. It doesn't
# fail the check on its own: that's the job of "aisignoff lint".
name: aisignoff PR diff

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  AISIGNOFF_VERSION: "0.14.0"   # pin a release, so a new version can't break your CI unannounced

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base commit and the history behind each line
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "aisignoff==${AISIGNOFF_VERSION}"
      - name: Declarations of the changed lines
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # the merge preview's first parent: the base branch as this run merged it (the event's
          # base.sha can be older, and then the change would include the base branch's new commits)
          BASE=$(git rev-parse HEAD^1)
          printf '%s\n' "$DESCRIPTION" > "$RUNNER_TEMP/description.md"
          {
            echo '### AI signoff of the changed lines'
            aisignoff diff "$BASE" --markdown --depth 2 --declare-from "$RUNNER_TEMP/description.md" \
              --author "$AUTHOR" || echo "aisignoff diff failed, see the log"
          } >> "$GITHUB_STEP_SUMMARY"

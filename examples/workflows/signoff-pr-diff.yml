# Example workflow: show reviewers the declarations of just the lines a pull request changes.
# Copy it to .github/workflows/ in your repository. Most useful with [history] in SIGNOFF.toml
# (line-by-line declarations from git, aisignoff >= 0.6); without it, the changed lines take the
# file-level declarations.
#
#   - writes "aisignoff diff" to the job summary: the levels of the added and removed lines per
#     folder, attestations the pull request adds, and how the repository's shares move
#   - declares the pull request's lines from its description, as aisignoff reads the merge or
#     squash commit when the repository's default commit message is "Pull request title and
#     description": "Key: value" lines (AI-Generation, Human-Review, AI-Review and the names), or
#     the ticked checkboxes of the pull request template (not both; both is a warning). Invalid
#     levels are skipped with a warning.
#
# It only reads the repository, so it also works for pull requests from forks. It doesn't
# fail the check on its own: that's the job of "aisignoff lint".
name: aisignoff PR diff

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  AISIGNOFF_VERSION: "1.0.0"   # pin a release, so a new version can't break your CI unannounced

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base commit and the history behind each line
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "aisignoff==${AISIGNOFF_VERSION}"
      - name: Declarations of the changed lines
        run: |
          # the merge preview's first parent: the base branch as this run merged it (the event's
          # base.sha can be older, and then the change would include the base branch's new commits)
          BASE=$(git rev-parse HEAD^1)
          # the pull request's own declaration, read with aisignoff's own parser (as it will read the
          # merge or squash commit), as options for aisignoff diff
          python3 - "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/declare" <<'PY'
          import json, re, sys
          from aisignoff.history import parse_checkboxes, parse_trailers

          pr = json.load(open(sys.argv[1], encoding="utf-8"))["pull_request"]
          body = (pr.get("body") or "").replace("\r\n", "\n")
          trailers = parse_trailers(body, "the description")
          boxes = parse_checkboxes(body, (pr.get("user") or {}).get("login") or "", "the description")
          if trailers and boxes:
              print("::warning::the description declares levels both as trailers and as ticked checkboxes; "
                    "use one of them", file=sys.stderr)
          axes = [("--generation", "--assisted-by", "G"), ("--human", "--reviewed-by", "H"),
                  ("--ai", "--ai-reviewed-by", "A")]
          out = []
          for i, piece in {**boxes, **trailers}.items():
              option, who, letter = axes[i]
              if piece.problems:
                  print(f"::warning::{piece.problems[0]}", file=sys.stderr)
              if not re.fullmatch(letter + "[0-3]", piece.level):
                  if piece.level != "TODO":
                      print(f"::warning::ignored {piece.level} in the description: not {letter}0 to {letter}3",
                            file=sys.stderr)
                  continue
              out.append(f"{option}={piece.level}")
              out += [f"{who}={name}" for name in piece.names if name != "TODO"]
          if out:
              print("\n".join(out))
          PY
          mapfile -t DECLARE < "$RUNNER_TEMP/declare"
          {
            echo '### AI signoff of the changed lines'
            aisignoff diff "$BASE" --markdown --depth 2 "${DECLARE[@]}" || echo "aisignoff diff failed, see the log"
          } >> "$GITHUB_STEP_SUMMARY"

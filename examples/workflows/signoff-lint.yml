# Example workflow: check that every file declares how it was created and reviewed.
# Copy it to .github/workflows/ in your repository. Works in any repository with a SIGNOFF.toml.
#
#   - fails the check when a file has no valid declaration (aisignoff lint)
#   - writes the level mix of each folder to the job summary of each run
#   - uploads an interactive folder report (aisignoff-report.html) as an artifact of the run
#
# Then require the "aisignoff / lint" check in the branch protection of your default branch,
# so no undeclared file gets merged.
name: aisignoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AISIGNOFF_VERSION: "0.12.0"   # pin a release, so a new version can't break your CI unannounced

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, for line-by-line declarations ([history])
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "aisignoff==${AISIGNOFF_VERSION}"
      - name: Summary and folder report
        run: |
          {
            echo '### AI signoff'
            aisignoff report --tree --markdown --depth 3 || true
          } >> "$GITHUB_STEP_SUMMARY"
          # outside the work tree, or lint would count the report as an undeclared file; with the text
          # of each file, and in a pull request the lines it changes (aisignoff >= 0.7): since the
          # first parent of the merge preview, the base branch as this run merged it
          SINCE=""
          if [ "${{ github.event_name }}" = pull_request ]; then SINCE=HEAD^1; fi
          aisignoff report --html "$RUNNER_TEMP/aisignoff-report.html" --with-source ${SINCE:+--since "$SINCE"} || true
      - uses: actions/upload-artifact@v4
        with:
          name: aisignoff-report
          path: ${{ runner.temp }}/aisignoff-report.html
      - name: Check declarations
        run: aisignoff lint
        # run: aisignoff lint --strict   # also fail on warnings, such as annotations that match no file
      # With [history]: a pull request's own lines are declared by its description, which lands as
      # the message of its merge or squash commit. This checks it before the merge (aisignoff >= 0.12).
      # Add "types: [opened, edited, synchronize, reopened]" to pull_request above, so that it runs
      # again when the description is edited.

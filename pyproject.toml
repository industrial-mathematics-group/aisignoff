[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aisignoff"
version = "0.7.1"
description = "Sign off on AI use per file: declare and check AI generation (G0-G3), human review (H0-H3) and AI review (A0-A3), REUSE-style."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Industrial Mathematics Group" }]
keywords = ["ai", "declaration", "provenance", "code review", "research software", "reuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[dependency-groups]
dev = ["pytest"]

[project.scripts]
aisignoff = "aisignoff.cli:main"

[project.urls]
Homepage = "https://github.com/industrial-mathematics-group/aisignoff"
Documentation = "https://industrial-mathematics-group.github.io/aisignoff/"
Issues = "https://github.com/industrial-mathematics-group/aisignoff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisignoff = ["report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

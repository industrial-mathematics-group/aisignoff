<!doctype html>
<!-- aisignoff folder report: generated by 'aisignoff report --html'. Self-contained, works offline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI signoff · __AISIGNOFF_TITLE__</title>
<style>
:root {
  --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
  --accent: #0969da; --undeclared: #cf222e; --hover: #eaeef2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #9198a1;
    --accent: #4493f8; --undeclared: #f85149; --hover: #21262d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.meta { color: var(--muted); font-size: 13px; }
.meta code { font-size: 12px; }
.stats { display: flex; gap: 24px; margin-top: 10px; flex-wrap: wrap; }
.stat b { font-size: 18px; display: block; }
.stat span { color: var(--muted); font-size: 12px; }
.stat.bad b { color: var(--undeclared); }
.stat.mix b { font-size: 13px; font-weight: 600; line-height: 27px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 24px;
  border-bottom: 1px solid var(--border); background: var(--surface); }
.group { display: flex; align-items: center; gap: 8px; }
.group[hidden] { display: none; }
.group > label { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--text); padding: 5px 10px; font: inherit;
  font-size: 13px; cursor: pointer; border-left: 1px solid var(--border); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .45; cursor: default; }
.search { position: relative; margin-left: auto; }
.search input { font: inherit; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); width: 260px; max-width: 70vw; }
.results { position: absolute; right: 0; top: 34px; z-index: 5; width: 420px; max-width: 90vw; max-height: 360px;
  overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); display: none; }
.results div { padding: 5px 10px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results div:hover, .results div.active { background: var(--hover); }
.explain { padding: 8px 24px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
main { display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 24px; padding: 16px 24px 32px; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
main > section { min-width: 0; }
main > section:last-child { overflow-x: auto; }
.crumbs { grid-column: 1 / -1; font-size: 14px; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { color: var(--muted); margin: 0 4px; }
#chart svg { width: 100%; height: auto; display: block; }
#chart path { cursor: pointer; stroke: var(--bg); stroke-width: 1; }
#chart path.problem { stroke: var(--undeclared); stroke-width: 2; }
#chart path:hover { opacity: .8; }
#chart .center { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.ramp { width: 120px; height: 12px; border-radius: 3px; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
th.num, td.num { text-align: right; }
th[aria-sort="ascending"]::after { content: " ▲"; }
th[aria-sort="descending"]::after { content: " ▼"; }
td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.selected { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
td.name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
td.name .dir { font-weight: 600; }
.bad-name { color: var(--undeclared); }
.bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; min-width: 90px; background: var(--surface); }
.bar i { display: block; height: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: ui-monospace, monospace; font-size: 12px; }
.panel { margin-top: 16px; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: none; }
.panel h2 { font-size: 14px; margin: 0 0 8px; font-family: ui-monospace, monospace; word-break: break-all; }
.panel h2 a { color: var(--accent); }
.panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; }
.panel .errors { color: var(--undeclared); margin: 8px 0 0; padding-left: 18px; }
.panel h3 { font-size: 13px; margin: 12px 0 4px; }
.panel .parts { margin: 0; padding-left: 18px; font-size: 13px; }
.panel .parts a { color: var(--accent); }
.panel .runs { color: var(--muted); font-size: 12px; }
.panel .close { float: right; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.lines-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-top: 12px; }
.lines-head h3 { margin: 0; }
.lines-head label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.lines-head .hint { font-size: 12px; color: var(--muted); }
.strip { display: flex; height: 14px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; background: var(--surface); }
.strip i { display: block; height: 100%; cursor: pointer; }
.strip i:hover { opacity: .75; }
.cstrip { position: relative; height: 4px; margin-bottom: 4px; }
.cstrip i { position: absolute; top: 0; height: 100%; min-width: 2px; background: var(--accent); }
.code { position: relative; max-height: 560px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.code .row { display: flex; white-space: pre; min-width: max-content; }
.code .ln { flex: none; width: 4.5em; text-align: right; padding-right: 8px; color: var(--muted); user-select: none; }
.code .ln a { color: inherit; text-decoration: none; }
.code .ln a:hover { text-decoration: underline; }
.code .lv { flex: none; width: 5px; margin-right: 8px; }
.code .mk { flex: none; width: 1.2em; color: var(--accent); user-select: none; }
.code .tx { padding-right: 16px; }
.code .row.changed { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.code .row.hl { box-shadow: inset 0 0 0 1px var(--accent); }
.code .skip { color: var(--muted); padding: 2px 8px 2px 5.5em; background: var(--surface); cursor: pointer; font-family: inherit; }
.code .skip:hover { color: var(--accent); }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none;
  max-width: 360px; }
#tip b { font-family: ui-monospace, monospace; word-break: break-all; }
footer { padding: 0 24px 24px; color: var(--muted); font-size: 12px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls">
  <div class="group"><label>Axis</label><div class="seg" id="axis"></div></div>
  <div class="group"><label>Folder colour</label><div class="seg" id="mode">
    <button data-v="average">Average</button><button data-v="majority">Majority</button><button data-v="weakest">Weakest link</button>
  </div></div>
  <div class="group"><label>Size by</label><div class="seg" id="weight">
    <button data-v="files">Files</button><button data-v="lines">Lines</button>
  </div></div>
  <div class="group" id="changes-group" hidden><label>Show</label><div class="seg" id="changes">
    <button data-v="all">Everything</button><button data-v="changed" id="changed-button">Changed</button>
  </div></div>
  <div class="search"><input id="q" type="search" placeholder="Find a file or folder…" autocomplete="off" aria-label="Find a file or folder"><div class="results" id="results"></div></div>
</div>
<div class="explain" id="explain"></div>
<main>
  <nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
  <section>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section>
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer>Levels: <a href="https://industrial-mathematics-group.github.io/aisignoff/#the-levels">aisignoff documentation</a>. Excluded files are not shown.</footer>
<div id="tip"></div>
<script type="application/json" id="data">__AISIGNOFF_DATA__</script>
<script>
"use strict";
const { meta, tree } = JSON.parse(document.getElementById("data").textContent);
const UNDECLARED = "undeclared";
const GEN = meta.axes[0].key, HUM = meta.axes[1].key, GAP = "gap";
// the review gap: generation level minus human review level, never below 0 (G3 reviewed at H1 = 2)
const GAP_AXIS = { key: GAP, title: "Review gap", levels: { "0": "review as deep as the AI share",
  "1": "review one level short", "2": "two levels short", "3": "three levels short" } };
const AXES = [...meta.axes, GAP_AXIS];
const AXIS = Object.fromEntries(AXES.map(a => [a.key, a]));
// one ordinal ramp per axis, the same in light and dark mode so a colour always means the same level.
// Each ramp steps far apart in lightness (OKLCH L 0.87 / 0.71 / 0.55 / 0.39) and turns its hue as it
// darkens, so neighbouring levels differ in both and stay apart even in the thin line strips
const RAMPS = {
  [GEN]: ["#f3de90", "#f28e42", "#c93a5f", "#65247d"],
  [HUM]: ["#e2e58d", "#68c36d", "#008b86", "#124a7b"],
  [meta.axes[2].key]: ["#f7cce7", "#cf8ec9", "#8d5ab1", "#413781"],
  [GAP]: ["#f5dc98", "#e9a03e", "#c46016", "#7d3317"],
};
const ramp = key => RAMPS[key];
const MODES = {
  average: "Each folder (and each file with several declarations) takes the weighted average of its levels over its {weight}, coloured between the steps: 50% H0 and 50% H2 look like H1. A red outline marks folders with files that lack a valid declaration.",
  majority: "Each folder takes the level that covers most of its {weight}. A red outline marks folders with files that lack a valid declaration.",
  weakest: "Each folder takes its weakest level: the least-reviewed file inside (for generation and the review gap, the highest). Use it to find the files that hold a folder back.",
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
};
const SVG = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const fmt = n => n.toLocaleString("en");

// ---------------------------------------------------------------- index and derived values
const byPath = new Map();
const levelKeys = key => Object.keys(AXIS[key].levels);
const levelIndex = (key, lv) => levelKeys(key).indexOf(lv);
function prepare(n, parent) {
  n.parent = parent;
  byPath.set(n.path, n);
  if (n.type === "file") {
    if (!n.counts) n.counts = Object.fromEntries(meta.axes.map(a => [a.key, {
      files: { [n.levels[a.key]]: 1 }, lines: { [n.levels[a.key]]: n.lines } }]));
    // with line-level declarations (history), a file has parts: runs of lines with one declaration
    const parts = n.parts || [{ lines: n.lines, levels: n.levels }];
    const gaps = { files: {}, lines: {} }, total = parts.reduce((s, p) => s + p.lines, 0) || 1;
    for (const p of parts) {
      const g = partGap(p);
      gaps.lines[g] = (gaps.lines[g] || 0) + p.lines;
      gaps.files[g] = (gaps.files[g] || 0) + p.lines / total;
    }
    n.counts[GAP] = gaps;
    n.levels = { ...n.levels, [GAP]: parts.length === 1 ? partGap(parts[0]) : folderLevel(n, GAP, "majority", "lines") };
    return;
  }
  n.counts[GAP] = { files: {}, lines: {} };
  for (const c of n.children) {
    prepare(c, n);
    for (const w of ["files", "lines"]) for (const [g, v] of Object.entries(c.counts[GAP][w])) n.counts[GAP][w][g] = (n.counts[GAP][w][g] || 0) + v;
  }
}
function partGap(p) {
  if (p.levels[GEN] === UNDECLARED || p.levels[HUM] === UNDECLARED) return UNDECLARED;
  return String(Math.max(0, levelIndex(GEN, p.levels[GEN]) - levelIndex(HUM, p.levels[HUM])));
}
prepare(tree, null);

// ---------------------------------------------------------------- state (kept in the URL hash)
const state = { path: "", axis: GEN, mode: "average", weight: "files", file: null, sort: null, dir: 1,
  changes: "all", onlyChanged: true, line: null };
const SINCE = meta.since;  // with 'report --html --since BASE': files and folders carry added/removed/changed
const sinceText = () => SINCE.commit.startsWith(SINCE.name) ? SINCE.name : `${SINCE.name} (${SINCE.commit.slice(0, 7)})`;
const isChanged = n => n.type === "dir" ? n.changed_files > 0 : (n.added || n.removed) > 0;
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (byPath.has(h.get("path")) && byPath.get(h.get("path")).type === "dir") state.path = h.get("path");
  if (AXIS[h.get("axis")]) state.axis = h.get("axis");
  if (MODES[h.get("mode")]) state.mode = h.get("mode");
  if (h.get("mode") === "gap") state.axis = GAP;  // the review gap was a folder colour mode before 0.11
  if (["files", "lines"].includes(h.get("weight"))) state.weight = h.get("weight");
  state.file = byPath.has(h.get("file")) ? h.get("file") : null;
  if (SINCE && h.get("changes") === "changed") state.changes = "changed";
  state.line = /^\d+$/.test(h.get("line") || "") ? Number(h.get("line")) : null;
}
function writeHash() {
  const h = new URLSearchParams();
  if (state.path) h.set("path", state.path);
  if (state.axis !== GEN) h.set("axis", state.axis);
  if (state.mode !== "average") h.set("mode", state.mode);
  if (state.weight !== "files") h.set("weight", state.weight);
  if (state.file) h.set("file", state.file);
  if (state.changes !== "all") h.set("changes", state.changes);
  if (state.file && state.line) h.set("line", state.line);
  const s = h.toString();
  history.replaceState(null, "", s ? "#" + s : location.pathname + location.search);
}

// ---------------------------------------------------------------- colours
function rank(key, lv) {  // higher = worse (more AI, less review, a wider gap); undeclared is worst
  if (lv === UNDECLARED) return 99;
  const i = levelIndex(key, lv);
  return key === GEN || key === GAP ? i : -i;
}
function levelColour(key, lv) {
  if (lv === UNDECLARED) return css("--undeclared");
  return ramp(key)[levelIndex(key, lv)];
}
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function averageOf(n, key, weight = state.weight) {  // weighted mean level index (0-3) of the declared parts
  let s = 0, w = 0;
  for (const [lv, c] of Object.entries(n.counts[key][weight])) {
    if (lv === UNDECLARED || !c) continue;
    s += c * levelIndex(key, lv); w += c;
  }
  return w ? s / w : null;
}
function averageColour(key, a) {
  if (a == null) return css("--undeclared");
  const r = ramp(key), i = Math.min(2, Math.floor(a));
  return mix(r[i], r[i + 1], Math.min(1, a - i));
}
const averageText = (key, a) => a == null ? "no valid declarations" : `average ${key === GAP ? "" : levelKeys(key)[0][0]}${a.toFixed(1)}`;
function folderLevel(n, key, mode, weight = state.weight) {
  const counts = n.counts[key][weight];
  const present = Object.keys(counts).filter(lv => counts[lv] > 0);
  if (!present.length) return null;
  if (mode === "weakest") return present.reduce((a, b) => rank(key, b) > rank(key, a) ? b : a);
  // majority; ties go to the worse level
  return present.reduce((a, b) => counts[b] > counts[a] || (counts[b] === counts[a] && rank(key, b) > rank(key, a)) ? b : a);
}
function colourOf(n) {
  if (state.mode === "average" && (n.type === "dir" || mixed(n))) return averageColour(state.axis, averageOf(n, state.axis));
  const lv = n.type === "file" && !mixed(n) ? n.levels[state.axis] : folderLevel(n, state.axis, state.mode === "average" ? "majority" : state.mode);
  return lv ? levelColour(state.axis, lv) : css("--border");
}
function mixText(n, key) {
  const counts = n.counts[key][state.weight];
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  return Object.entries(counts).map(([lv, c]) => `${key === GAP && lv !== UNDECLARED ? "gap " : ""}${lv} ${Math.round(100 * c / total)}%`).join(" · ");
}

// ---------------------------------------------------------------- sunburst
const SIZE = 520, R = SIZE / 2 - 4, R0 = R * 0.24, MAX_RINGS = 6;
function depthBelow(n, limit) {
  if (n.type === "file" || limit === 0) return 0;
  return 1 + Math.max(0, ...n.children.map(c => depthBelow(c, limit - 1)));
}
function arcPath(a0, a1, r0, r1) {
  if (a1 - a0 > 2 * Math.PI - 1e-6) a1 = a0 + 2 * Math.PI - 1e-4;
  const pt = (a, r) => `${(SIZE / 2 + r * Math.sin(a)).toFixed(2)},${(SIZE / 2 - r * Math.cos(a)).toFixed(2)}`;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${pt(a0, r1)}A${r1},${r1} 0 ${large} 1 ${pt(a1, r1)}L${pt(a1, r0)}A${r0},${r0} 0 ${large} 0 ${pt(a0, r0)}Z`;
}
function drawChart() {
  const focus = byPath.get(state.path);
  const rings = Math.max(1, depthBelow(focus, MAX_RINGS));
  const ringW = (R - R0) / rings;
  const svg = svgEl("svg", { viewBox: `0 0 ${SIZE} ${SIZE}`, role: "img",
    "aria-label": `Sunburst of ${focus.path || meta.title}, coloured by ${AXIS[state.axis].title}` });
  const place = (n, a0, a1, depth) => {
    const total = n[state.weight];
    if (!total || depth > rings) return;
    let a = a0;
    for (const c of n.children) {
      const span = (a1 - a0) * c[state.weight] / total;
      if (span > 0.003) {
        const p = svgEl("path", { d: arcPath(a, a + span, R0 + (depth - 1) * ringW, R0 + depth * ringW - 0.5), fill: colourOf(c) });
        if (state.changes === "changed" && !isChanged(c)) p.setAttribute("fill-opacity", 0.18);
        if (c.type === "dir" && c.errors) p.classList.add("problem");
        if (c.type === "file" && c.errors.length) p.classList.add("problem");
        p.addEventListener("mousemove", e => showTip(e, c));
        p.addEventListener("mouseleave", hideTip);
        p.addEventListener("click", () => c.type === "dir" ? go(c.path) : selectFile(c.path));
        svg.append(p);
        if (c.type === "dir") place(c, a, a + span, depth + 1);
      }
      a += span;
    }
  };
  place(focus, 0, 2 * Math.PI, 1);
  const g = svgEl("g", { class: "center" });
  g.append(svgEl("circle", { cx: SIZE / 2, cy: SIZE / 2, r: R0 - 2, fill: colourOf(focus), "fill-opacity": 0.25, stroke: css("--border") }));
  const t1 = svgEl("text", { x: SIZE / 2, y: SIZE / 2 - 4, "text-anchor": "middle", "font-size": 15, "font-weight": 600, fill: css("--text") });
  t1.textContent = focus.path ? focus.name.split("/").pop() + "/" : meta.title;
  if (t1.textContent.length > 18) t1.textContent = t1.textContent.slice(0, 17) + "…";
  const t2 = svgEl("text", { x: SIZE / 2, y: SIZE / 2 + 16, "text-anchor": "middle", "font-size": 12, fill: css("--muted") });
  t2.textContent = `${fmt(focus[state.weight])} ${state.weight}` + (focus.parent ? " · up" : "");
  g.append(t1, t2);
  g.addEventListener("click", () => focus.parent && go(focus.parent.path));
  g.addEventListener("mousemove", e => showTip(e, focus));
  g.addEventListener("mouseleave", hideTip);
  svg.append(g);
  $("chart").replaceChildren(svg);
}
function showTip(e, n) {
  const tip = $("tip");
  const lines = [el("b", { text: (n.path || meta.title) + (n.type === "dir" ? "/" : "") })];
  if (n.type === "file") {
    lines.push(el("div", { text: mixed(n) ? `${AXIS[state.axis].title}: ${mixText(n, state.axis)}`
      : meta.axes.map(a => n.levels[a.key]).join(" · ") + (n.levels[GAP] !== UNDECLARED ? ` · gap ${n.levels[GAP]}` : "") }));
    if (mixed(n)) lines.push(el("div", { text: averageText(state.axis, averageOf(n, state.axis)) }));
    if (n.errors.length) lines.push(el("div", { class: "bad-name", text: n.errors.join("; ") }));
    if (SINCE && isChanged(n)) lines.push(el("div", { text: `+${fmt(n.added)} −${fmt(n.removed)} lines since ${SINCE.name}` }));
  } else {
    lines.push(el("div", { text: `${fmt(n.files)} files · ${fmt(n.lines)} lines` }));
    lines.push(el("div", { text: `${AXIS[state.axis].title}: ${mixText(n, state.axis)}` }));
    lines.push(el("div", { text: averageText(state.axis, averageOf(n, state.axis)) }));
    if (n.errors) lines.push(el("div", { class: "bad-name", text: `${n.errors} file(s) without a valid declaration` }));
    if (SINCE && isChanged(n)) lines.push(el("div", { text: `+${fmt(n.added)} −${fmt(n.removed)} lines in ${fmt(n.changed_files)} file(s) since ${SINCE.name}` }));
  }
  tip.replaceChildren(...lines);
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { $("tip").style.display = "none"; }

// ---------------------------------------------------------------- legend
function drawLegend() {
  const items = [];
  for (const [lv, name] of Object.entries(AXIS[state.axis].levels))
    items.push(el("span", {}, el("i", { class: "sw", style: `background:${levelColour(state.axis, lv)}` }),
      `${state.axis === GAP ? "gap " : ""}${lv} ${name}`));
  if (state.mode === "average")
    items.push(el("span", {}, el("i", { class: "ramp", style: `background:linear-gradient(90deg,${ramp(state.axis).join(",")})` }), "averages in between"));
  items.push(el("span", {}, el("i", { class: "sw", style: `background:${css("--undeclared")}` }), "undeclared or invalid"));
  $("legend").replaceChildren(...items);
}

// ---------------------------------------------------------------- table
const COLUMNS = [
  { id: "name", title: "Name" },
  { id: "files", title: "Files", num: true },
  { id: "lines", title: "Lines", num: true },
  ...AXES.map(a => ({ id: a.key, title: a.key === GAP ? "Gap" : a.title })),
  ...(SINCE ? [{ id: "added", title: "Changed", num: true }] : []),
];
function score(n, key) {  // average level index, worse = higher (for sorting)
  const counts = n.counts[key][state.weight];
  let s = 0, w = 0;
  for (const [lv, c] of Object.entries(counts)) { s += c * (lv === UNDECLARED ? 10 : rank(key, lv)); w += c; }
  return w ? s / w : 0;
}
function sortValue(n, col) {
  if (col === "name") return n.name.toLowerCase();
  if (col === "files" || col === "lines" || col === "added") return n[col] || 0;
  return score(n, col);
}
const mixed = n => n.type === "file" && Array.isArray(n.parts) && n.parts.length > 1;
function bar(n, key) {
  const counts = n.counts[key][state.weight];
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  if (n.type === "file" && (!mixed(n) || Object.keys(counts).length === 1)) {
    const lv = n.levels[key];
    return el("span", { class: "chip", title: lv === UNDECLARED ? "undeclared or invalid" : AXIS[key].levels[lv] },
      el("i", { class: "sw", style: `background:${levelColour(key, lv)}` }), lv === UNDECLARED ? "✗" : lv);
  }
  const b = el("div", { class: "bar", title: mixText(n, key) });
  for (const [lv, c] of Object.entries(counts))
    if (c) b.append(el("i", { style: `width:${100 * c / total}%;background:${levelColour(key, lv)}` }));
  return b;
}
function drawTable() {
  const head = COLUMNS.map(c => {
    const th = el("th", { class: c.num ? "num" : "", text: c.title, onclick: () => {
      state.dir = state.sort === c.id ? -state.dir : (c.id === "name" ? 1 : -1);
      state.sort = c.id; drawTable();
    } });
    if (state.sort === c.id) th.setAttribute("aria-sort", state.dir > 0 ? "ascending" : "descending");
    if (AXIS[c.id]) th.title = c.id === GAP
      ? "Review gap (generation level minus human review level). Sort by average gap: widest first"
      : "Sort by average level: worst first";
    return th;
  });
  $("thead").replaceChildren(...head);
  const focus = byPath.get(state.path);
  let kids = [...focus.children];
  if (state.changes === "changed") kids = kids.filter(isChanged);
  if (state.sort) {
    kids.sort((a, b) => {
      const x = sortValue(a, state.sort), y = sortValue(b, state.sort);
      return (x < y ? -1 : x > y ? 1 : 0) * state.dir || a.name.localeCompare(b.name);
    });
  }
  const rows = [];
  if (focus.parent) rows.push(el("tr", { onclick: () => go(focus.parent.path) },
    el("td", { class: "name", colspan: COLUMNS.length }, el("span", { class: "dir", text: "../" }))));
  for (const n of kids) {
    const bad = n.type === "dir" ? n.errors > 0 : n.errors.length > 0;
    const name = el("td", { class: "name" }, el("span", {
      class: (n.type === "dir" ? "dir " : "") + (bad ? "bad-name" : ""),
      text: n.name + (n.type === "dir" ? "/" : "") }));
    const tr = el("tr", { onclick: () => n.type === "dir" ? go(n.path) : selectFile(n.path) },
      name, el("td", { class: "num", text: fmt(n.files) }), el("td", { class: "num", text: fmt(n.lines) }),
      ...AXES.map(a => el("td", {}, bar(n, a.key))),
      ...(SINCE ? [el("td", { class: "num changed-cell", text: isChanged(n) ? `+${fmt(n.added)} −${fmt(n.removed)}` : "" })] : []));
    if (n.path === state.file) tr.classList.add("selected");
    tr.addEventListener("mousemove", e => showTip(e, n));
    tr.addEventListener("mouseleave", hideTip);
    rows.push(tr);
  }
  $("rows").replaceChildren(...rows);
}

// ---------------------------------------------------------------- file panel
function drawPanel() {
  const panel = $("panel");
  const n = state.file && byPath.get(state.file);
  if (!n) { panel.style.display = "none"; return; }
  const d = n.declaration;
  const title = meta.link
    ? el("a", { href: meta.link + n.path.split("/").map(encodeURIComponent).join("/"), target: "_blank", rel: "noopener", text: n.path })
    : n.path;
  const dl = el("dl");
  const add = (k, v) => { if (v && (!Array.isArray(v) || v.length)) dl.append(el("dt", { text: k }), el("dd", { text: Array.isArray(v) ? v.join("; ") : v })); };
  for (const a of meta.axes) {
    const lv = d[a.key];
    add(a.title, lv ? (a.levels[lv] ? `${lv} · ${a.levels[lv]}` : lv) : "missing");
  }
  add("Assisted-by", d["Assisted-by"]);
  add("Reviewed-by", d["Reviewed-by"]);
  add("AI-Reviewed-by", d["AI-Reviewed-by"]);
  const g = averageOf(n, GAP, "lines");
  add("Review gap", g == null ? null : Number.isInteger(g) ? String(g) : `${g.toFixed(1)} on average`);
  add(mixed(n) ? "Most lines from" : "Declared in", d.source === "none" ? "nowhere" : d.source);
  add("Size", `${fmt(n.lines)} lines`);
  const kids = [el("button", { class: "close", "aria-label": "Close", text: "×", onclick: () => { state.file = null; render(); } }),
    el("h2", {}, title), dl];
  if (mixed(n)) {
    kids.push(el("h3", { text: "Declarations" }));
    kids.push(el("ul", { class: "parts" }, ...n.parts.map(p => {
      const ranges = p.runs.slice(0, 4).map(([a, b]) => a === b ? String(a) : `${a}–${b}`).join(", ") + (p.runs.length > 4 ? ", …" : "");
      const title = meta.link ? el("a", { href: meta.link + n.path.split("/").map(encodeURIComponent).join("/") + `#L${p.runs[0][0]}` + (p.runs[0][1] > p.runs[0][0] ? `-L${p.runs[0][1]}` : ""), target: "_blank", rel: "noopener", text: `${fmt(p.lines)} lines` }) : `${fmt(p.lines)} lines`;
      return el("li", {}, el("b", {}, title), ` · ${meta.axes.map(a => p.levels[a.key]).join(" ")} · ${p.declaration.source === "none" ? "undeclared" : p.declaration.source}`,
        el("div", { class: "runs", text: `lines ${ranges}` }));
    })));
  }
  if (n.errors.length) kids.push(el("ul", { class: "errors" }, ...n.errors.map(e => el("li", { text: e }))));
  kids.push(...drawLines(n));
  panel.replaceChildren(...kids);
  panel.style.display = "block";
  if (state.line) scrollToLine(state.line, false);
}

// ---------------------------------------------------------------- line view
// A file as runs of lines with one declaration each (with [history]; otherwise one run for the file).
function fileParts(n) {
  if (n.parts && n.parts.length) return n.parts;
  return [{ lines: n.lines, runs: [[1, n.lines]], levels: n.levels, declaration: n.declaration, errors: n.errors }];
}
function partColour(p) {
  return levelColour(state.axis, state.axis === GAP ? partGap(p) : p.levels[state.axis]);
}
const partText = p => `${meta.axes.map(a => p.levels[a.key]).join(" ")} · ${p.declaration.source === "none" ? "undeclared" : p.declaration.source}`;
const lineLink = (n, a, b) => meta.link ? meta.link + n.path.split("/").map(encodeURIComponent).join("/") + `#L${a}` + (b && b > a ? `-L${b}` : "") : null;
function scrollToLine(k, remember = true) {
  if (remember) { state.line = k; writeHash(); }
  const box = document.querySelector("#panel .code");
  const row = box && box.querySelector(`[data-line="${k}"]`);
  if (!row) return;
  box.querySelectorAll(".row.hl").forEach(r => r.classList.remove("hl"));
  row.classList.add("hl");
  box.scrollTop = row.offsetTop - box.clientHeight / 3;
}
const MAX_ROWS = 20000, CONTEXT = 3;
function drawLines(n) {
  const out = [];
  const src = n.source != null ? n.source.split(/\r?\n/) : null;
  if (src && src.length > 1 && src[src.length - 1] === "") src.pop();
  const total = Math.max(n.lines, src ? src.length : 0) || 1;
  const parts = fileParts(n);
  const segs = parts.flatMap((p, i) => p.runs.map(([a, b]) => [a, b, i])).sort((x, y) => x[0] - y[0]);
  const changed = new Set();
  for (const [a, b] of n.changed || []) for (let k = a; k <= b; k++) changed.add(k);
  const onlyChanged = !!(src && SINCE && changed.size && state.onlyChanged);

  const head = el("div", { class: "lines-head" }, el("h3", { text: "Lines" }),
    el("span", { class: "hint", text: `coloured by ${AXIS[state.axis].title.toLowerCase()}` }));
  if (SINCE && n.changed) {
    head.append(el("span", { class: "hint", text: changed.size ? `+${fmt(n.added)} −${fmt(n.removed)} since ${SINCE.name}` : `unchanged since ${SINCE.name}` }));
    if (src && changed.size) {
      const box = el("input", { type: "checkbox" });
      box.checked = state.onlyChanged;
      box.addEventListener("change", () => { state.onlyChanged = box.checked; drawPanel(); });
      head.append(el("label", {}, box, "only changed lines"));
    }
  }
  out.push(head);

  // the whole file at a glance: one segment per run, the changed lines underneath
  const strip = el("div", { class: "strip", role: "img", "aria-label": "Levels along the file" });
  for (const [a, b, i] of segs) {
    const p = parts[i];
    strip.append(el("i", { style: `width:${100 * (Math.min(b, total) - a + 1) / total}%;background:${partColour(p)}`,
      title: `${a === b ? "line " + a : `lines ${a}–${b}`}: ${partText(p)}`,
      onclick: () => {
        if (src) { if (onlyChanged && !changed.has(a)) state.onlyChanged = false; state.line = a; drawPanel(); writeHash(); }
        else if (lineLink(n, a, b)) window.open(lineLink(n, a, b), "_blank", "noopener");
      } }));
  }
  out.push(strip);
  if (changed.size) {
    const cs = el("div", { class: "cstrip", title: `changed since ${SINCE.name}` });
    for (const [a, b] of n.changed) cs.append(el("i", { style: `left:${100 * (a - 1) / total}%;width:${100 * (b - a + 1) / total}%` }));
    out.push(cs);
  }
  if (!src) {
    out.push(el("p", { class: "note", text: n.source_skipped ? `The text of this file isn't in the report (${n.source_skipped}).`
      : "Write the report with --with-source to read the lines here." }));
    return out;
  }

  const index = new Array(total + 1).fill(0);
  for (const [a, b, i] of segs) for (let k = a; k <= Math.min(b, total); k++) index[k] = i;
  let show = null;
  if (onlyChanged) {
    show = new Set();
    for (const k of changed) for (let j = k - CONTEXT; j <= k + CONTEXT; j++) if (j >= 1 && j <= src.length) show.add(j);
  }
  const code = el("div", { class: "code" });
  const rows = [];
  let skipped = 0;
  const flushSkip = () => {
    if (!skipped) return;
    rows.push(el("div", { class: "skip", text: `⋯ ${fmt(skipped)} unchanged line${skipped > 1 ? "s" : ""}`,
      onclick: () => { state.onlyChanged = false; drawPanel(); } }));
    skipped = 0;
  };
  const last = Math.min(src.length, MAX_ROWS);
  for (let k = 1; k <= last; k++) {
    if (show && !show.has(k)) { skipped++; continue; }
    flushSkip();
    const p = parts[index[k]];
    const link = lineLink(n, k);
    rows.push(el("div", { class: "row" + (changed.has(k) ? " changed" : ""), "data-line": k },
      el("span", { class: "ln" }, link ? el("a", { href: link, target: "_blank", rel: "noopener", text: String(k) }) : String(k)),
      el("span", { class: "lv", style: `background:${partColour(p)}`, title: partText(p) }),
      el("span", { class: "mk", text: changed.has(k) ? "+" : "" }),
      el("span", { class: "tx", text: src[k - 1] })));
  }
  flushSkip();
  code.append(...rows);
  code.addEventListener("click", e => { const r = e.target.closest(".row"); if (r && !e.target.closest("a")) scrollToLine(Number(r.dataset.line)); });
  out.push(code);
  if (src.length > MAX_ROWS) out.push(el("p", { class: "note", text: `Showing the first ${fmt(MAX_ROWS)} of ${fmt(src.length)} lines.` }));
  return out;
}

// ---------------------------------------------------------------- header, controls, navigation
function drawHeader() {
  $("title").textContent = meta.title;
  const m = [`aisignoff ${meta.version}`, `generated ${meta.generated}`];
  $("meta").replaceChildren(...(meta.commit ? [el("code", { text: meta.commit.slice(0, 7) }), " · "] : []), m.join(" · "));
  const stat = (v, label, cls = "") => el("div", { class: "stat " + cls }, el("b", { text: v }), el("span", { text: label }));
  $("stats").replaceChildren(
    stat(fmt(tree.files), "files"), stat(fmt(tree.lines), "lines"),
    tree.errors ? stat(fmt(tree.errors), "without a valid declaration", "bad") : stat("✓", "all files declared"),
    ...AXES.map(a => stat(mixText(tree, a.key) || "–", a.title, "mix")),
    ...(SINCE ? [stat(`+${fmt(tree.added)} −${fmt(tree.removed)}`, `lines in ${fmt(tree.changed_files)} file(s) since ${sinceText()}`, "mix")] : []));
}
function drawControls() {
  for (const [id, key] of [["axis", "axis"], ["mode", "mode"], ["weight", "weight"], ["changes", "changes"]])
    for (const b of $(id).children) b.setAttribute("aria-pressed", String(b.dataset.v === state[key]));
  $("explain").textContent = MODES[state.mode].replace("{weight}", state.weight) + (state.changes === "changed"
    ? ` Showing what changed since ${sinceText()}; unchanged parts are faded.` : "");
}
function drawCrumbs() {
  const parts = [];
  for (let n = byPath.get(state.path); n; n = n.parent) parts.unshift(n);
  const kids = [];
  parts.forEach((n, i) => {
    if (i) kids.push(el("span", { class: "sep", text: "/" }));
    const label = i ? n.name : meta.title;
    kids.push(i === parts.length - 1 ? el("b", { text: label }) : el("a", { text: label, onclick: () => go(n.path) }));
  });
  $("crumbs").replaceChildren(...kids);
}
function render() { writeHash(); drawHeader(); drawControls(); drawCrumbs(); drawChart(); drawLegend(); drawTable(); drawPanel(); }
function go(path) { state.path = path; if (state.file && !state.file.startsWith(path ? path + "/" : "")) state.file = null; hideTip(); render(); }
function selectFile(path) { const n = byPath.get(path); state.path = n.parent.path; state.file = path; state.line = null; hideTip(); render(); }

$("axis").append(...AXES.map(a => el("button", { "data-v": a.key, text: a.title })));
if (SINCE) { $("changes-group").hidden = false; $("changed-button").textContent = `Changed since ${SINCE.name}`; }
for (const [id, key] of [["axis", "axis"], ["mode", "mode"], ["weight", "weight"], ["changes", "changes"]])
  $(id).addEventListener("click", e => { const v = e.target.dataset && e.target.dataset.v; if (v && !e.target.disabled) { state[key] = v; render(); } });

// search
const all = [...byPath.values()].filter(n => n.path);
$("q").addEventListener("input", () => {
  const q = $("q").value.trim().toLowerCase();
  const box = $("results");
  if (q.length < 2) { box.style.display = "none"; return; }
  const hits = all.filter(n => n.path.toLowerCase().includes(q)).slice(0, 60);
  box.replaceChildren(...(hits.length ? hits.map(n => el("div", {
    text: n.path + (n.type === "dir" ? "/" : ""), class: (n.type === "file" && n.errors.length) ? "bad-name" : "",
    onclick: () => { box.style.display = "none"; $("q").value = ""; n.type === "dir" ? go(n.path) : selectFile(n.path); } }))
    : [el("div", { text: "no match" })]));
  box.style.display = "block";
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = $("results").firstElementChild; if (first) first.click(); }
  if (e.key === "Escape") { $("results").style.display = "none"; }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").style.display = "none"; });
addEventListener("hashchange", () => { readHash(); render(); });

readHash();
if (state.file) state.path = byPath.get(state.file).parent.path;
render();
</script>
</body>
</html>
